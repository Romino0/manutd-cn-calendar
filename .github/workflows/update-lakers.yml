name: Update Chinese Lakers calendar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "translate_lakers.py"
      - ".github/workflows/update-lakers.yml"
  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and translate Lakers calendar
        run: python translate_lakers.py

      - name: Commit updated calendar
        run: |
          if git diff --quiet -- lakers-cn.ics && git ls-files --error-unmatch lakers-cn.ics >/dev/null 2>&1; then
            echo "No calendar changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lakers-cn.ics
          git commit -m "Update Lakers Chinese calendar"
          git push
