name: Update Chinese Manchester United calendar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "translate_calendar.py"
      - ".github/workflows/update-calendar.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and translate official calendar
        run: python translate_calendar.py

      - name: Commit updated calendar
        run: |
          if git diff --quiet -- manutd-cn.ics; then
            echo "No calendar changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manutd-cn.ics
          git commit -m "Update Manchester United Chinese calendar"
          git push
